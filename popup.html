<!DOCTYPE html>
<html data-theme="dark">

<head>
    <meta charset="UTF-8">
    <style>
        /* CSS Variables for Multi-Theme Support */
        :root[data-theme="dark"] {
            --bg: #0f0f23;
            --surface: #1e1e3f;
            --text: #cccccc;
            --text-strong: #ffffff;
            --primary: #009000;
            --primary-hover: #00cc00;
            --border: #333333;
        }

        :root[data-theme="light"] {
            --bg: #f4f4f9;
            --surface: #ffffff;
            --text: #333333;
            --text-strong: #000000;
            --primary: #007a00;
            --primary-hover: #009900;
            --border: #cccccc;
        }

        :root[data-theme="hacker"] {
            --bg: #050505;
            --surface: #0a0a0a;
            --text: #00ff00;
            --text-strong: #00ff00;
            --primary: #004400;
            --primary-hover: #00cc00;
            --border: #00ff00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 320px;
            margin: 0;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h3 {
            color: var(--primary-hover);
            margin-top: 0;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
        }

        .theme-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .theme-btn {
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.2s;
        }

        .theme-btn:hover,
        .theme-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: var(--surface);
            color: var(--text-strong);
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            transition: all 0.3s ease;
            font-family: monospace;
        }

        .input-group input:focus {
            border-color: var(--primary-hover);
            box-shadow: 0 0 8px rgba(0, 204, 0, 0.2);
        }

        button#saveBtn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        button#saveBtn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 204, 0, 0.3);
        }

        button#saveBtn:active {
            transform: translateY(0);
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            font-weight: bold;
            height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #status.show {
            opacity: 1;
        }

        .footer {
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
            font-size: 12px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .footer a {
            color: var(--primary-hover);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--text-strong);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h3>🚀 AoC GitHub Sync</h3>

    <div class="theme-selector">
        <button class="theme-btn active" data-set="dark">Dark</button>
        <button class="theme-btn" data-set="light">Light</button>
        <button class="theme-btn" data-set="hacker">Hacker</button>
    </div>

    <div class="input-group">
        <input type="password" id="ghToken" placeholder="GitHub PAT (ghp_...)">
    </div>
    <div class="input-group">
        <input type="text" id="ghRepo" placeholder="Repo (e.g., Swarup-Ingale/aoc)">
    </div>

    <button id="saveBtn">Save Settings</button>
    <div id="status"></div>

    <div class="footer">
        Developed by <strong>Swarup Ingale</strong>
        <div class="footer-links">
            <a href="https://github.com/Swarup-Ingale" target="_blank">GitHub</a> |
            <a href="https://linkedin.com/in/swarup-ingale-45864b295" target="_blank">LinkedIn</a> |
            <a href="https://swale-os-portfolio.pages.dev/" target="_blank">Portfolio</a> |
            <a href="https://github.com/Swarup-Ingale/aoc/issues" target="_blank">Issues</a>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
